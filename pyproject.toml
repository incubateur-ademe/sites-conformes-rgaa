[project]
name = "sites-conformes-rgaa"
version = "0.1.0"
description = "RGAA accessibility helpers for sites-conformes: wrap decorative emoji so screen readers skip them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "Framework :: Wagtail",
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "wagtail>=6.0",
    "sites-conformes>=4.0",
    "beautifulsoup4>=4.12",
    "emoji>=2.15",
]

[project.urls]
Homepage = "https://github.com/incubateur-ademe/sites-conformes-rgaa"
Repository = "https://github.com/incubateur-ademe/sites-conformes-rgaa"
Changelog = "https://github.com/incubateur-ademe/sites-conformes-rgaa/blob/main/CHANGELOG.md"
Issues = "https://github.com/incubateur-ademe/sites-conformes-rgaa/issues"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sites_conformes_rgaa"
